<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Property Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root{
      --radius: 12px;
      --gap: 16px;
      --shadow: 0 10px 25px rgba(0,0,0,.08);
      --border: 1px solid #e7e7e7;
      --text: #111;
      --muted: #666;
      --bg: #fff;
    }

    input[type="number"]{ -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }

    body{
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: #fff;
      overflow-x: hidden;
      max-width: 100%;
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 18px 60px;
      min-width: 0;
      overflow-x: hidden;
    }

    .bleed{
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
      margin-bottom: 18px;
    }

    @media (min-width: 641px) {
      .bleed{
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
      }
    }

    #map{
      height: 420px;
      outline: 1px solid #e8e8e8;
      position: relative;
      z-index: 0;
    }

    .searchBar{
      display: grid;
      grid-template-columns:
        minmax(0, 1.6fr)
        minmax(0, 1fr)
        minmax(0, 1fr)
        minmax(0, 1fr)
        minmax(0, 1fr)
        minmax(0, 1fr)
        140px;
      gap: 12px;
      padding: 14px;
      border: var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
      align-items: end;
      position: relative;
      z-index: 1;
      margin-bottom: 14px;
      min-width: 0;
      width: 100%;
    }

    .field{ min-width: 0; display: grid; grid-template-rows: auto 44px auto; align-content: start; }
    .field label{ font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field select{
      width: 100%; height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid #dcdcdc; font-size: 14px;
      background: #fff; align-self: end;
    }

    .btn{
      height: 44px; padding: 12px 16px; background: #111; color: #fff; border-radius: 10px; cursor: pointer;
      border: none; font-weight: 600; width: 140px; align-self: end;
    }

    .meta{ color: var(--muted); margin: 8px 0 12px; }

    .cards{ display: grid; grid-template-columns: 1fr; gap: var(--gap); margin-top: 10px; border-top: var(--border); padding-top: 16px; }
    @media (min-width: 640px){ .cards{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (min-width: 1024px){ .cards{ grid-template-columns: repeat(3, minmax(0,1fr)); } }

    .card{
      display: grid; grid-template-rows: auto 1fr auto;
      background: var(--bg); border: var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .card:hover{ transform: translateY(-2px); box-shadow: var(--shadow); }

    .card__media{ position: relative; aspect-ratio: 4 / 3; background: #eee; }
    .card__media img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .card__body{ padding: 14px; }
    .card__loc{ color: var(--muted); font-size: 14px; margin-bottom: 6px; }
    .card__title{ font-size: 18px; font-weight: 600; margin: 0 0 6px; color: var(--text); text-decoration: none; }
    .card__meta{ color: var(--muted); font-size: 14px; margin-top: 6px; }
    .chip{ display:inline-block; background:#f6f6f6; padding:6px 10px; border-radius:999px; font-size:12px; margin-top:8px; }
    .status-badge{ display:inline-block; padding:4px 9px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
    .status-available{ background:#dcfce7; color:#15803d; }
    .status-under-offer{ background:#fef9c3; color:#92400e; }
    .status-let-agreed{ background:#fee2e2; color:#b91c1c; }
    .status-sold{ background:#fee2e2; color:#b91c1c; }
    .status-sold-stc{ background:#ffedd5; color:#c2410c; }
    .status-other{ background:#f3f4f6; color:#374151; }

    .card__footer{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-top: var(--border); }
    .btn-link, .btn-ghost{ height:36px; padding:0 12px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; text-decoration:none; }
    .btn-ghost{ border:1px solid #ddd; color:#333; background:#fff; }
    .btn-link{ background:#111; color:#fff; border:none; }
    /* FIX: "No brochure" is now a span, not a fake link */
    .btn-link--disabled{ background:#ccc; color:#fff; border:none; cursor:default; opacity:.6; pointer-events:none; }
    .empty{ padding: 24px; color: var(--muted); }

    .prop-popup .leaflet-popup-content { margin: 0 !important; }
    .prop-popup .leaflet-popup-content-wrapper { padding: 0; border-radius: 12px; overflow: hidden; }
    .prop-popup .leaflet-popup-tip { display: none; }
    .pop-card { width: 320px; background: #fff; }
    .pop-img  { width: 100%; height: 160px; background-size: cover; background-position: center; background-color: #eee; }
    .pop-body { padding: 12px 14px; }
    .pop-title{ font-weight: 700; margin: 0 0 4px; }
    .pop-sub  { color: #6b7280; font-size: 13px; margin-bottom: 4px; }
    .pop-size { font-size: 13px; margin-bottom: 10px; }
    .pop-btn  { display: inline-block; padding: 8px 12px; border-radius: 8px; background:#111; color:#fff; text-decoration:none; font-weight:600; }

    @media (max-width: 640px){
      html, body { overflow-x: hidden; }
      #map{ height: 300px; }
      .wrap{ padding-left: 12px; padding-right: 12px; }
      .searchBar{ grid-template-columns: 1fr; }
      .btn{ width: 100%; }
    }

    /* ============================================================
       REDESIGN v2 — scoped under .search-page-v2 / .property-card--v2
       Original classes above are untouched for safety.
       ============================================================ */

    /* Fonts */
    .search-page-v2 h1, .search-page-v2 h2, .search-page-v2 h3,
    .property-card--v2 .card-tenure {
      font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
    }
    .search-page-v2, .search-page-v2 p, .search-page-v2 input,
    .search-page-v2 select, .search-page-v2 button,
    .property-card--v2, .property-card--v2 .card-desc,
    .property-card--v2 .card-meta-row, .property-card--v2 .card-address-link,
    .property-card--v2 .btn-card-primary, .property-card--v2 .btn-card-tour,
    .v2-result-summary {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Search bar v2 */
    .search-page-v2 .searchBar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 18px;
      border: 1px solid #e7e7e7;
      border-radius: 12px;
      background: #fff;
      box-shadow: none;
      align-items: flex-end;
      margin-bottom: 8px;
    }
    .search-page-v2 .searchBar .field {
      flex: 1 1 120px;
      min-width: 0;
    }
    .search-page-v2 .searchBar .field--location {
      flex: 2 1 180px;
    }
    .search-page-v2 .search-row-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .btn-search-v2 {
      height: 44px;
      padding: 0 28px;
      background: #f4c20d;
      color: #111;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-search-v2:hover { background: #e0b00c; }

    /* Result count v2 */
    .search-page-v2 .v2-result-summary {
      margin: 4px 0 14px;
    }
    .search-page-v2 .v2-result-summary .v2-showing {
      font-size: 14px;
      color: #666;
    }
    .search-page-v2 .v2-result-summary .v2-found {
      font-size: 14px;
      font-weight: 600;
      color: #111;
    }

    /* ── Property card v2 — values copied verbatim from reference ── */
    .property-card--v2 {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #F4F4F5;
      border: 1px solid #E8E8E8;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: none;
    }

    /* Image: edge-to-edge, 16/11 ratio */
    .property-card--v2 .card-media {
      position: relative;
      aspect-ratio: 16 / 11;
      background: #ddd center / cover no-repeat;
      flex-shrink: 0;
    }
    .property-card--v2 .card-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Carousel arrows: 44×74px dark rectangles, flush to edges */
    .property-card--v2 .card-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 74px;
      border: 0;
      background: rgba(40,40,40,0.55);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 2;
    }
    .property-card--v2 .card-arrow--prev { left: 0; }
    .property-card--v2 .card-arrow--next { right: 0; }
    .property-card--v2 .card-arrow:hover { background: rgba(40,40,40,0.8); }

    /* Status badge: rounded rectangle, not pill */
    .property-card--v2 .card-status-banner {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #F5B400;
      color: #141414;
      z-index: 3;
    }
    .property-card--v2 .card-status-banner--available {
      background: #22A45D;
      color: #fff;
    }

    /* Card body */
    .property-card--v2 .card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 22px 24px 24px;
      background: #F4F4F5;
    }

    /* Title: 25px weight-300 Jost */
    .property-card--v2 .card-address-link,
    .property-card--v2 .card-address-link:link,
    .property-card--v2 .card-address-link:visited,
    .property-card--v2 .card-address-link:active {
      display: block;
      margin: 0 0 12px;
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 25px;
      font-weight: 300;
      line-height: 1.18;
      letter-spacing: -0.01em;
      color: #1C1C1C;
      text-decoration: none;
    }
    .property-card--v2 .card-address-link:hover,
    .property-card--v2 .card-address-link:focus {
      color: #1C1C1C;
      text-decoration: underline;
      text-underline-offset: 2px;
      outline: none;
    }

    /* TO LET: 17px bold */
    .property-card--v2 .card-tenure {
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #1C1C1C;
      margin-bottom: 14px;
    }

    /* Description: 16px, ink-soft, 3-line clamp */
    .property-card--v2 .card-desc {
      margin: 0 0 18px;
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      color: #3A3A3A;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Meta rows */
    .property-card--v2 .card-meta-row {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 22px;
    }
    .property-card--v2 .card-meta-row > span {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 16px;
      color: #1C1C1C;
    }
    .property-card--v2 .card-meta-icon {
      width: 22px;
      display: inline-flex;
      justify-content: center;
      color: #F5B400;
      flex: none;
    }

    /* Footer: margin-top:auto pins to bottom; nowrap keeps 360° Tour on same row */
    .property-card--v2 .card-footer {
      margin-top: auto;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      padding: 0;
    }
    .property-card--v2 .btn-card-primary {
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 11px 12px;
      border: 0;
      border-radius: 6px;
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #141414;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .property-card--v2 .btn-card-primary:hover { background: #2a2a2a; color: #fff; }
    .property-card--v2 .btn-card-tour {
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 11px 12px;
      border: 0;
      border-radius: 6px;
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #F5B400;
      color: #141414;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .property-card--v2 .btn-card-tour:hover { background: #e0a800; }

    /* When all 3 buttons are present, spread them evenly across the row */
    .property-card--v2 .card-footer:has(.btn-card-tour) > * { flex: 1 1 0; }

    @media (max-width: 640px) {
      .search-page-v2 .searchBar .field { flex: 1 1 100%; }
      .search-page-v2 .searchBar .field--location { flex: 1 1 100%; }
    }
  </style>
</head>

<body>
<div class="wrap search-page-v2">
  <!-- Map is above search bar in v2 design -->
  <div class="bleed"><div id="map"></div></div>

  <!-- Search bar v2: flat, all fields in one row, Search button below -->
  <div class="searchBar" id="searchForm">
    <div class="field field--location"><label for="q">Location</label><input id="q" placeholder="Town, postcode" /></div>
    <div class="field"><label for="tenure">Tenure</label>
      <select id="tenure">
        <option value="any">Any</option>
        <option value="to let">To Let</option>
        <option value="for sale">For Sale</option>
      </select>
    </div>
    <div class="field"><label for="status">Status</label>
      <select id="status">
        <option value="any" selected>All Properties</option>
        <option value="available">Available</option>
        <option value="under offer">Under Offer</option>
      </select>
    </div>
    <div class="field"><label for="type">Type</label>
      <select id="type">
        <option value="any">Any</option>
        <option value="Industrial">Industrial</option>
        <option value="Office">Office</option>
        <option value="Retail">Retail</option>
        <option value="Development/Investment">Development/Investment</option>
      </select>
    </div>
    <div class="field"><label for="radius">Radius</label>
      <select id="radius">
        <option value="any">Any</option>
        <option value="1">1 mile</option>
        <option value="3">3 miles</option>
        <option value="5">5 miles</option>
        <option value="10">10 miles</option>
        <option value="15">15 miles</option>
        <option value="25">25 miles</option>
        <option value="50">50 miles</option>
      </select>
    </div>
    <div class="field"><label for="minSize">Min size (sq ft)</label>
      <select id="minSize">
        <option value="">No min</option>
        <option value="1000">1,000 sq ft</option>
        <option value="2000">2,000 sq ft</option>
        <option value="5000">5,000 sq ft</option>
        <option value="10000">10,000 sq ft</option>
        <option value="20000">20,000 sq ft</option>
      </select>
    </div>
    <div class="field"><label for="maxSize">Max size (sq ft)</label>
      <select id="maxSize">
        <option value="">No max</option>
        <option value="1000">1,000 sq ft</option>
        <option value="2000">2,000 sq ft</option>
        <option value="5000">5,000 sq ft</option>
        <option value="10000">10,000 sq ft</option>
        <option value="20000">20,000 sq ft</option>
      </select>
    </div>
  </div>
  <!-- Search button below the fields row -->
  <div class="search-row-actions">
    <button class="btn-search-v2" id="searchBtn" type="button">Search</button>
  </div>

  <!-- Result summary v2: two lines -->
  <div class="v2-result-summary" id="v2ResultSummary" aria-live="polite">
    <div class="v2-showing" id="statusText">Loading properties…</div>
    <div class="v2-found" id="resultsCount"></div>
  </div>

  <div class="cards" id="results"></div>
</div>

<script>
let allProperties = [];
let map, markers, searchMarker;
const MAPBOX_TOKEN = "";

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371e3; const toRad = d => d * Math.PI / 180;
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δφ = toRad(lat2 - lat1); const Δλ = toRad(lon2 - lon1);
  const a = Math.sin(Δφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function sortByDistance(list, point) {
  return list.map(p => {
    const lat = Number(p.lat), lon = Number(p.lon);
    const d = (isFinite(lat) && isFinite(lon)) ? haversine(point.lat, point.lon, lat, lon) : Number.POSITIVE_INFINITY;
    return { p, d };
  }).sort((a, b) => a.d - b.d).map(({ p, d }) => ({ ...p, __distance: d }));
}

async function geocodePlace(q) {
  const query = q.trim(); if (!query) return null;
  try {
    if (MAPBOX_TOKEN) {
      const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?limit=1&country=gb&access_token=${MAPBOX_TOKEN}`;
      const r = await fetch(url); const j = await r.json(); const f = j.features && j.features[0]; if (!f) return null;
      return { lat: f.center[1], lon: f.center[0], label: f.place_name };
    } else {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q=${encodeURIComponent(query)}`;
      const r = await fetch(url, { headers: { 'Accept-Language': 'en', 'User-Agent': 'GJSDillon-PropertySearch/1.0' } });
      const j = await r.json();
      if (!Array.isArray(j) || !j[0]) return null;
      return { lat: Number(j[0].lat), lon: Number(j[0].lon), label: j[0].display_name };
    }
  } catch (e) { console.warn('Geocode failed:', e); return null; }
}

function milesToMeters(mi) { return mi * 1609.344; }

function getPrimaryImage(p) {
  if (!p) return '';
  let url = '';
  if (Array.isArray(p.images) && p.images[0]) {
    const img = p.images[0];
    if (typeof img === 'string') url = img;
    else if (img._) url = img._;
    else if (img.url) url = img.url;
  }
  if (!url && Array.isArray(p.photos) && p.photos[0]?.url) url = p.photos[0].url;
  if (!url) url = p.image || p.image_url || '';
  // Append imgix params to crop images at source — prevents distortion
  if (url && url.includes('imgix.net') && !url.includes('?')) {
    url += '?w=800&h=600&fit=crop&auto=format';
  }
  return url;
}

function getTypesArray(p) {
  const out = [];
  if (Array.isArray(p.types)) out.push(...p.types.filter(Boolean));
  if (typeof p.type === 'string') out.push(p.type);
  if (typeof p.property_type === 'string') out.push(p.property_type);
  const uniq = [...new Set(out.map(s => String(s).trim()).filter(Boolean))];
  return { raw: uniq, lc: uniq.map(s => s.toLowerCase()) };
}

function getTenureLabel(p) {
  const legacy = String(p.tenure || p.transaction_type || '').toLowerCase();
  const isLet = (p.to_let === true) || /to\s*let|letting|lease/.test(legacy);
  const isSale = (p.for_sale === true) || /for\s*sale|sale|freehold/.test(legacy);
  if (isLet && isSale) return 'To Let / For Sale';
  if (isLet) return 'To Let';
  if (isSale) return 'For Sale';
  return '';
}

function getStatusBadge(p) {
  const status = String(p.status || 'Available').trim();
  const lc = status.toLowerCase();
  let cls = 'status-other';
  if (!lc || lc === 'available') cls = 'status-available';
  else if (lc.includes('under offer')) cls = 'status-under-offer';
  else if (lc.includes('let agreed')) cls = 'status-let-agreed';
  else if (lc === 'sold stc' || lc.includes('subject to contract')) cls = 'status-sold-stc';
  else if (lc === 'sold') cls = 'status-sold';
  const isUnavailable = !(!lc || lc === 'available');
  return { html: `<span class="status-badge ${cls}">${status}</span>`, isUnavailable };
}

function sizeText(p) {
  const a = Number(p.size_from_sqft || 0);
  const b = Number(p.size_to_sqft || 0);
  if (a && b && a !== b) return `${a.toLocaleString()}–${b.toLocaleString()} sq ft`;
  if (a) return `${a.toLocaleString()} sq ft`;
  if (b) return `${b.toLocaleString()} sq ft`;
  return '';
}

function initMap() {
  map = L.map('map').setView([52.5, -1.8], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  markers = L.layerGroup().addTo(map);
  searchMarker = L.layerGroup().addTo(map);
}

function updateMap(list, focusPoint) {
  markers.clearLayers();
  searchMarker.clearLayers();
  const points = [];

  list.forEach(p => {
    const lat = Number(p.lat), lon = Number(p.lon);
    if (!isFinite(lat) || !isFinite(lon)) return;

    const m = L.circleMarker([lat, lon], {
      radius: 8,
      weight: 0,
      color: 'transparent',
      fillColor: '#f4c20d',
      fillOpacity: 1
    });

    const img = getPrimaryImage(p);
    const where = [p.town, p.postcode].filter(Boolean).join(' ');
    const html = `
      <div class="pop-card">
        <div class="pop-img" style="background-image:url('${(img || '').replace(/'/g, "%27")}')"></div>
        <div class="pop-body">
          <div class="pop-title">${p.address || 'Property'}</div>
          <div class="pop-sub">${where}</div>
          <div class="pop-size">${sizeText(p)}</div>
          <a class="pop-btn" target="_self" href="property.html?id=${encodeURIComponent(p.id ?? '')}">View property</a>
        </div>
      </div>
    `;
    m.bindPopup(html, { className: 'prop-popup', maxWidth: 340 });
    m.addTo(markers);
    points.push([lat, lon]);
  });

  if (focusPoint && isFinite(focusPoint.lat) && isFinite(focusPoint.lon)) {
    const GJS_GOLD = '#FFCC33';
    const sp = L.circleMarker([focusPoint.lat, focusPoint.lon], {
      radius: 12,
      weight: 3,
      color: '#000',
      fillColor: GJS_GOLD,
      fillOpacity: 1.0
    }).addTo(searchMarker);

    L.circleMarker([focusPoint.lat, focusPoint.lon], {
      radius: 18,
      weight: 10,
      color: 'rgba(0,0,0,0.25)',
      opacity: 0.25,
      fill: false
    }).addTo(searchMarker);

    sp.bindTooltip(focusPoint.label || 'Search location', { direction: 'top', offset: [0, -12] });
    points.push([focusPoint.lat, focusPoint.lon]);
  }

  if (!points.length) return;
  const MAX_SEARCH_ZOOM = 11;
  if (points.length === 1) map.setView(points[0], MAX_SEARCH_ZOOM);
  else map.fitBounds(points, { padding: [60, 60], maxZoom: MAX_SEARCH_ZOOM });
}

function getStatusBannerClass(p) {
  const lc = String(p.status || 'Available').toLowerCase();
  if (!lc || lc === 'available') return 'card-status-banner--available';
  return ''; // yellow (default)
}

function render(list, context = {}) {
  const el = document.getElementById('results');

  // v2: two-line result count
  const parts = [`Showing ${list.length} of ${allProperties.length}`];
  if (context.nearLabel) {
    if (context.radiusMiles)
      parts.push(`within ${context.radiusMiles} mile${context.radiusMiles == 1 ? '' : 's'}`);
    parts.push(`of "${context.nearLabel}"`);
  }
  document.getElementById('statusText').textContent = parts.join(' ');
  document.getElementById('resultsCount').textContent = `${list.length} Properties Found`;

  if (!list.length) {
    el.innerHTML = `<div class="empty">No properties match your filters.</div>`;
    return;
  }

    const img = getPrimaryImage(p);
    const address = p.address || 'Property';

    const tenureLabel = getTenureLabel(p);

    const statusBannerCls = getStatusBannerClass(p);
    const types = getTypesArray(p);

    const hasTour = Array.isArray(p.virtual_tour_urls) && p.virtual_tour_urls.length > 0;

    const iconPound = `<svg width="13" height="17" viewBox="0 0 320 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M112 160.4c0-35.5 28.8-64.4 64.4-64.4c6.9 0 13.8 1.1 20.4 3.3l81.2 27.1c16.8 5.6 34.9-3.5 40.5-20.2s-3.5-34.9-20.2-40.5L217 38.6c-13.1-4.4-26.8-6.6-40.6-6.6C105.5 32 48 89.5 48 160.4V224H32c-17.7 0-32 14.3-32 32s14.3 32 32 32H48v74.8c0 17.2-5.5 33.9-15.6 47.7L6.4 446.9c-7.3 9.8-8.4 22.9-3 33.9S20.3 498.7 32.4 498.7H288c17.7 0 32-14.3 32-32s-14.3-32-32-32H93.3c5.6-13.9 8.5-28.8 8.5-43.9V288H208c17.7 0 32-14.3 32-32s-14.3-32-32-32H112V160.4z"/></svg>`;

    return `

          <button class="card-arrow card-arrow--prev" aria-label="Previous image">&#8249;</button>
          <button class="card-arrow card-arrow--next" aria-label="Next image">&#8250;</button>
        </div>
        <div class="card-body">
          <a class="card-address-link" href="property.html?id=${encodeURIComponent(p.id ?? '')}">${address}</a>
          ${tenureLabel ? `<div class="card-tenure">${tenureLabel}</div>` : ''}
          ${desc ? `<p class="card-desc">${desc}</p>` : ''}
          <div class="card-meta-row">
            ${typeLabel ? `<span><span class="card-meta-icon" aria-hidden="true">${iconBuilding}</span>${typeLabel}</span>` : ''}
            ${size ? `<span><span class="card-meta-icon" aria-hidden="true">${iconMaximize}</span>${size}</span>` : ''}

            ${hasTour ? `<a class="btn-card-tour" href="${tourUrl}" target="_blank" rel="noopener">360&deg; Tour</a>` : ''}

  }).join('');
}

async function applyFilters() {
  const params = new URLSearchParams();
  let q = document.getElementById('q').value.trim();
  const tenure = document.getElementById('tenure').value;
  const statusFilter = document.getElementById('status').value;
  const typeEl = document.getElementById('type');
  let type = (typeEl?.value || 'any');
  if (type === 'any' && typeEl?.dataset?.prefill) type = typeEl.dataset.prefill;
  const radiusVal = document.getElementById('radius').value;
  const minSize = document.getElementById('minSize').value.trim();
  const maxSize = document.getElementById('maxSize').value.trim();

  if (q) params.set('q', q);
  if (tenure && tenure !== 'any') params.set('tenure', tenure);
  if (statusFilter && statusFilter !== 'any') params.set('status', statusFilter);
  if (type && type !== 'any') params.set('type', type);
  if (radiusVal && radiusVal !== 'any') params.set('radius', radiusVal);
  if (minSize) params.set('minSize', minSize);
  if (maxSize) params.set('maxSize', maxSize);

  const tenureLC = tenure.toLowerCase();
  const statusLC = statusFilter.toLowerCase();
  const typeLC = type.toLowerCase();

  // FIX: Parse size values once, used in filter below
  const minSizeNum = minSize ? Number(minSize) : 0;
  const maxSizeNum = maxSize ? Number(maxSize) : 0;

  const base = allProperties.filter(p => {
    // Status filter
    if (statusLC !== 'any') {
      const propStatus = String(p.status || 'Available').toLowerCase();
      if (statusLC === 'available') {
        if (propStatus !== 'available') return false;
      } else if (statusLC === 'under offer') {
        if (!propStatus.includes('under offer')) return false;
      } else {
        if (!propStatus.includes(statusLC)) return false;
      }
    }
    if (tenureLC !== 'any') {
      const legacy = String(p.tenure || p.transaction_type || '').toLowerCase();
      const isLet = (p.to_let === true) || /to\s*let|letting|lease/.test(legacy);
      const isSale = (p.for_sale === true) || /for\s*sale|sale|freehold/.test(legacy);
      if (tenureLC === 'to let' && !isLet) return false;
      if (tenureLC === 'for sale' && !isSale) return false;
    }
    if (typeLC !== 'any') {
      const types = getTypesArray(p);
      if (!types.lc.some(t => t === typeLC)) return false;
    }
    // FIX: Size filter — property must overlap with the requested size range.
    // A property passes minSize if its largest available unit >= minSize.
    // A property passes maxSize if its smallest available unit <= maxSize.
    if (minSizeNum > 0) {
      const propMax = Number(p.size_to_sqft || p.size_from_sqft || 0);
      if (!propMax || propMax < minSizeNum) return false;
    }
    if (maxSizeNum > 0) {
      const propMin = Number(p.size_from_sqft || 0);
      if (!propMin || propMin > maxSizeNum) return false;
    }
    return true;
  });

  // Default sort: largest instruction first (size_to_sqft or size_from_sqft descending)
  const sortBySize = (list) => [...list].sort((a, b) => {
    const sizeA = Number(a.size_to_sqft || a.size_from_sqft || 0);
    const sizeB = Number(b.size_to_sqft || b.size_from_sqft || 0);
    return sizeB - sizeA;
  });

  if (!q) { const sorted = sortBySize(base); render(sorted); try{updateMap(sorted);}catch(e){} return; }

  const point = await geocodePlace(q);
  if (!point) {
    const s=sortBySize(base); render(s); try{updateMap(s);}catch(e){} return;
  }

  let finalList = sortByDistance(base, point);

  let radiusMiles = null;
  if (radiusVal !== 'any') {
    radiusMiles = Number(radiusVal);
    const meterLimit = milesToMeters(radiusMiles);
    finalList = finalList.filter(p => isFinite(p.__distance) && p.__distance <= meterLimit);
  }
  if (finalList.length > 60) finalList = finalList.slice(0, 60);

  render(finalList, { nearLabel: point.label || q, radiusMiles });
  try{updateMap(finalList, point);}catch(e){}
}

async function loadProperties() {
  try {
    const res = await fetch('./properties.json', { cache: 'no-store' });
    const raw = await res.json();
    allProperties = raw.map((p, i) => ({ id: p.id ?? p.slug ?? p.uid ?? i, ...p }));

    const typeSel = document.getElementById('type');
    if (typeSel.dataset.prefill) typeSel.value = typeSel.dataset.prefill;
    applyFilters();
  } catch (e) {
    document.getElementById('statusText').textContent = 'Failed to load properties.json';
    console.error(e);
  }
}

function getIncomingParams() {
  const sp = new URLSearchParams(location.search);
  const o = {}; for (const [k, v] of sp.entries()) o[k] = v; return o;
}

function prefillFromURL() {
  const incoming = getIncomingParams();
  const setVal = (id, v) => {
    if (v != null && v !== '') {
      const el = document.getElementById(id);
      if (el) el.value = v;
    }
  };
  setVal('q', incoming.q);
  setVal('tenure', (incoming.tenure || 'any').toLowerCase());
  setVal('status', (incoming.status || 'any').toLowerCase());
  setVal('radius', incoming.radius || 'any');
  setVal('minSize', incoming.minSize);
  setVal('maxSize', incoming.maxSize);
  const typePref = incoming.type || 'any';
  const typeEl = document.getElementById('type');
  if (typeEl) typeEl.dataset.prefill = typePref;
}

document.addEventListener('DOMContentLoaded', () => {
  try { initMap(); } catch(e) { console.warn('Map unavailable:', e.message); }
  document.getElementById('searchBtn').onclick = applyFilters;
  document.getElementById('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); applyFilters(); }
  });
  prefillFromURL();
  loadProperties();
});

// Robust Leaflet popup navigation inside iframes
document.addEventListener('click', (e) => {
  const a = e.target?.closest ? e.target.closest('a.pop-btn') : null;
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href) return;
  e.preventDefault();
  window.location.href = href;
});
</script>

<!-- ---------- Auto-resize for Squarespace embed ---------- -->
<script>
(function() {
  const MSG_TYPE = 'gjs-prop-height';
  const frameId = new URLSearchParams(location.search).get('frameId') || 'search';
  function calcHeight() {
    const wrap = document.querySelector('.wrap');
    if (!wrap) return document.documentElement.scrollHeight;
    const rect = wrap.getBoundingClientRect();
    return Math.max(Math.ceil(rect.top + window.scrollY + rect.height + 4), 300);
  }
  function sendHeight() {
    const h = calcHeight();
    window.parent?.postMessage({ type: MSG_TYPE, id: frameId, height: h }, '*');
  }
  const ro = new ResizeObserver(sendHeight);
  ro.observe(document.documentElement); ro.observe(document.body);
  const mo = new MutationObserver(sendHeight);
  mo.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
  window.addEventListener('load', sendHeight);
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('img').forEach(i => {
      if (!i.complete) i.addEventListener('load', sendHeight, { once: true });
    });
  });
  let ticks = 0;
  const poll = setInterval(() => { sendHeight(); if (++ticks >= 10) clearInterval(poll); }, 1000);
})();
</script>
